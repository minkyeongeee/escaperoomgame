<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>html{color-scheme:dark}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>재난 상황실 탈출</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Gothic+Coding:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: a disaster-control-room status board on top, one "room" panel below; 특보 colors (주의보 amber, 경보 red) carry state. */
:root{
  /* Layout: blacked-out control room on emergency power. Integrated status board (bezel monitor) on top, one zone monitor below.
     Red = locked / emergency, amber = in progress, phosphor green = system online. Deliberately single dark theme. */
  --bg:#06090B; --panel:#0D1317; --panel-2:#131C21; --ink:#E4ECEE; --muted:#8D9DA4; --line:#24323A;
  --signal:#3DDBA8; --signal-ink:#03140E; --signal-soft:#0E2A22;
  --caution:#FFC21A; --caution-soft:#2B2009; --danger:#E8262B; --danger-soft:#2C0F0C; --ok:#3DDBA8; --ok-soft:#0E2A22;
  --sea:#081419; --sea-ink:#4D7A8B; --land:#1D3833; --land-hover:#2A4F47;
  --display:"Malgun Gothic","맑은 고딕","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  --term:"Nanum Gothic Coding","IBM Plex Mono","Noto Sans KR",monospace;
  --body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono","Nanum Gothic Coding",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.65;word-break:keep-all}
.wrap{max-width:940px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px;display:grid;gap:18px}
h1,h2,h3{font-family:var(--display);font-weight:400;line-height:1.25;text-wrap:balance;margin:0;letter-spacing:.01em}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible{outline:3px solid var(--signal);outline-offset:2px}

/* status board */
.board{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:grid;gap:12px}
.board-top{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between}
.brand{display:flex;flex-direction:column}
.brand small{font-size:12px;color:var(--muted);letter-spacing:.08em}
.brand b{font-family:var(--display);font-weight:400;font-size:20px}
.meters{display:flex;gap:16px;font-family:var(--mono);font-size:14px;color:var(--muted)}
.meters span b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.lamps{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.lamp{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--muted);text-align:center;line-height:1.3}
.lamp i{width:100%;height:8px;border-radius:2px;background:var(--danger-soft);border:1px solid var(--danger);transition:background .4s}
.lamp.now i{background:var(--caution);border-color:var(--caution)}
.lamp.done i{background:var(--ok);border-color:var(--ok)}
.pieces{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.slot{width:38px;height:38px;border:1.5px dashed var(--line);border-radius:6px;display:grid;place-items:center;font-family:var(--display);font-size:22px;color:var(--ink)}
.slot.got{border-style:solid;border-color:var(--signal);background:var(--signal-soft)}

/* room panel */
.room{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.room-head{padding:18px 20px 14px;border-bottom:1px solid var(--line);display:grid;gap:6px}
.tag{font-family:var(--mono);font-size:12px;letter-spacing:.1em;color:var(--signal);text-transform:uppercase}
.room-head h2{font-size:clamp(24px,5vw,32px)}
.room-body{padding:18px 20px 22px;display:grid;gap:16px}
.story{color:var(--muted);text-wrap:pretty}
.mission{background:var(--panel-2);border-left:4px solid var(--caution);padding:10px 14px;border-radius:0 6px 6px 0;font-weight:500}
.mission .lbl{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--caution);font-weight:600}

/* cards with segmented choice */
.cards{display:grid;gap:10px}
.card{border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:grid;gap:10px;background:var(--panel)}
.card p{font-size:15px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--panel-2);border-radius:999px;padding:5px 14px;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--signal);border-color:var(--signal);color:var(--signal-ink);font-weight:700}

/* match rows */
.match{display:grid;gap:10px}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:12px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.mrow p{font-size:15px;min-width:0}
select{font:inherit;font-size:15px;padding:7px 10px;border-radius:6px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink);width:100%}
@media (max-width:560px){.mrow{grid-template-columns:1fr}}

/* data note */
.data{border:1px solid var(--line);border-radius:8px;padding:12px 14px;font-size:14px;background:var(--panel-2)}
.data b{font-family:var(--mono);font-size:12px;letter-spacing:.08em;color:var(--muted);display:block;margin-bottom:4px}

/* real map */
.mapbox{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,340px);gap:18px;align-items:start}
@media (max-width:700px){.mapbox{grid-template-columns:1fr}}
.kmap{display:block;width:100%;max-width:340px;height:auto;margin:0 auto;background:var(--sea);border-radius:8px}
.kmap .prov{fill:var(--land);stroke:var(--panel);stroke-width:1;stroke-linejoin:round;cursor:pointer;transition:fill .15s}
.kmap .prov:hover,.kmap .prov:focus-visible{fill:var(--land-hover);outline:none}
.kmap .prov[aria-pressed="true"]{fill:var(--caution)}
.kmap .sea{fill:var(--sea-ink);font-size:13px;font-family:var(--body)}
.kmap .mark{pointer-events:none}
.kmap .mark circle{fill:var(--ink);stroke:var(--panel);stroke-width:1.5}
.kmap .mark text{fill:var(--panel);font-size:11px;font-weight:700;text-anchor:middle;font-family:var(--mono)}
.mapnote{font-size:12px;color:var(--muted);text-align:center;margin-top:6px}
.steps{display:flex;gap:6px;font-family:var(--mono);font-size:12px}
.steps span{padding:2px 8px;border-radius:4px;border:1px solid var(--line);color:var(--muted)}
.steps span.on{border-color:var(--caution);color:var(--ink);background:var(--caution-soft)}
.steps span.ok{border-color:var(--ok);color:var(--ok)}

/* sequence */
.seqpool,.seqline{display:grid;gap:8px}
.seqline{counter-reset:s;min-height:48px;border:1.5px dashed var(--line);border-radius:8px;padding:8px}
.seqline:empty::before{content:"아래 카드를 일어나는 순서대로 누르세요";color:var(--muted);font-size:14px;padding:6px}
.chip{text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:10px 12px;font-size:15px}
.chip:disabled{opacity:.35;cursor:default}
.seqline .chip{counter-increment:s;display:flex;gap:10px;align-items:baseline;background:var(--signal-soft);border-color:var(--signal)}
.seqline .chip::before{content:counter(s);font-family:var(--mono);font-weight:600;color:var(--signal)}

/* multiple choice */
.mcq{display:grid;gap:8px}
.mcq .q{font-weight:700}
.opt{text-align:left;border:1px solid var(--line);background:var(--panel-2);border-radius:8px;padding:9px 12px;font-size:15px}
.opt[aria-pressed="true"]{border-color:var(--signal);background:var(--signal-soft);font-weight:500}

/* controls & feedback */
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{border:0;border-radius:8px;padding:10px 20px;font-weight:700;background:var(--signal);color:var(--signal-ink)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);font-weight:500}
.btn:disabled{opacity:.45;cursor:default}
.fb{font-size:15px;font-weight:500;padding:9px 12px;border-radius:6px}
.fb.bad{background:var(--danger-soft);color:var(--danger)}
.fb.good{background:var(--ok-soft);color:var(--ok)}
.hintbox{background:var(--caution-soft);border-radius:6px;padding:9px 12px;font-size:14px}
.hintbox b{color:var(--caution)}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* typhoon map, O/X, text input */
.tymap .bg{fill:var(--land);stroke:var(--panel);stroke-width:.8}
.tymap .track{fill:none;stroke:var(--danger);stroke-width:3;stroke-dasharray:7 5}
.tymap .arrhead{fill:var(--danger)}
.tymap .half{fill:var(--caution-soft);fill-opacity:.55;stroke:var(--ink);stroke-width:1.2;stroke-dasharray:4 3;cursor:pointer}
.tymap .half:hover,.tymap .half:focus-visible{fill-opacity:.85;outline:none}
.tymap .half[aria-pressed="true"]{fill:var(--caution);fill-opacity:.9}
.tymap .eye{fill:var(--danger);stroke:var(--panel);stroke-width:2;pointer-events:none}
.oxrow{display:flex;gap:8px}
.oxrow .opt{min-width:64px;text-align:center;font-weight:700}
input[type=text]{font:inherit;font-size:15px;padding:7px 10px;border-radius:6px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink);width:100%;min-width:0}
input[type=text]:focus-visible{outline:3px solid var(--signal);outline-offset:2px}
.mrow > div{min-width:0}

/* explanation after solve */
.explain{border:1px solid var(--ok);border-radius:8px;overflow:hidden}
.explain h3{font-size:18px;background:var(--ok-soft);color:var(--ok);padding:10px 14px}
.explain ul{margin:0;padding:12px 14px 12px 32px;display:grid;gap:4px;font-size:15px}
.reward{display:flex;align-items:center;gap:14px;padding:4px 14px 14px}
.reward .slot{width:52px;height:52px;font-size:30px}

/* intro & final */
.hero{padding:26px 22px;display:grid;gap:14px;background:var(--panel)}
.hero h1{font-size:clamp(32px,8vw,52px)}
.hero h1 em{font-style:normal;color:var(--danger)}
.alertmsg{border:1px solid var(--line);border-radius:14px;overflow:hidden;max-width:460px;background:var(--panel-2);box-shadow:0 6px 18px rgba(0,0,0,.08)}
.am-top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;background:var(--danger);color:#fff;padding:8px 14px;font-size:13px}
.am-top b{font-weight:700;letter-spacing:.02em;display:flex;align-items:center;gap:6px}
.am-top b::before{content:"!";display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:#fff;color:var(--danger);font-weight:700;font-size:12px}
.am-top span{opacity:.9;font-family:var(--mono);font-size:12px}
.alertmsg p{padding:12px 14px;font-size:15px;line-height:1.6}
.rules-box{display:grid;gap:10px;border:2px solid var(--caution);background:var(--caution-soft);border-radius:10px;padding:14px 16px}
.rules-box > b{font-family:var(--display);font-weight:400;font-size:20px;color:var(--ink);letter-spacing:.02em}
.penalty{color:var(--danger);font-size:12px}
.rules{display:grid;gap:10px;font-size:16px;font-weight:500;color:var(--ink);padding-left:24px;margin:0}
.rules li::marker{font-family:var(--mono);font-weight:600;color:var(--caution)}
.ln{display:block;text-wrap:balance}
.recap-head{font-family:var(--mono);font-size:12px;letter-spacing:.1em;color:var(--signal)}
.door{border:3px solid var(--ink);border-radius:8px;padding:18px;display:grid;gap:14px;position:relative;
  background:repeating-linear-gradient(-45deg,var(--caution) 0 14px,var(--ink) 14px 28px) top/100% 12px no-repeat,var(--panel)}
.door{padding-top:30px}
.lockslots{display:flex;gap:10px;justify-content:center}
.lockslots .slot{width:60px;height:60px;font-size:34px;border-width:2px}
.tiles{display:flex;gap:10px;justify-content:center}
.tiles button{width:60px;height:60px;font-family:var(--display);font-size:32px;border:1px solid var(--signal);background:var(--signal-soft);border-radius:8px}
.tiles button:disabled{opacity:.25}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{border:1px solid var(--line);border-radius:8px;padding:10px 14px}
.stat small{color:var(--muted);font-size:13px}
.stat b{display:block;font-family:var(--mono);font-size:24px;font-variant-numeric:tabular-nums}
.recap{display:grid;gap:10px}
.recap section{border-top:1px solid var(--line);padding-top:10px}
.recap h3{font-size:17px;margin-bottom:4px}
.recap ul{margin:0;padding-left:20px;font-size:15px;display:grid;gap:2px}

/* ===== control-room skin ===== */
body{background:
  radial-gradient(120% 60% at 50% -10%, rgba(255,75,62,.16), transparent 60%),
  radial-gradient(80% 50% at 50% 110%, rgba(61,219,168,.05), transparent 70%), var(--bg)}
body::before{content:"";position:fixed;inset:0 0 auto;height:calc(4px + env(safe-area-inset-top,0px));z-index:10;background:var(--danger);box-shadow:0 0 22px 6px rgba(255,75,62,.55);animation:beacon 2.4s ease-in-out infinite}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:9;background:repeating-linear-gradient(0deg,rgba(255,255,255,.018) 0 1px,transparent 1px 3px)}
@keyframes beacon{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes flicker{0%,100%{opacity:1}3%{opacity:.4}6%{opacity:1}42%{opacity:.85}44%{opacity:1}}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:0}
.brand b,.rules-box > b,.slot,.tiles button{font-weight:700}

/* status board = bezel monitor */
.board{background:linear-gradient(180deg,#0F171B,#0A1013);border:1px solid var(--line);border-radius:6px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.02),0 10px 30px rgba(0,0,0,.5)}
.brand small{font-family:var(--term);color:var(--muted);letter-spacing:.04em}
.brand b{font-family:var(--display);font-size:19px;display:flex;align-items:center;gap:8px}
.brand b::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--danger);box-shadow:0 0 8px var(--danger);animation:blink 1.2s steps(2) infinite}
.pwr{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--danger);border:1px solid var(--danger);padding:1px 6px;border-radius:3px}
.meters{gap:10px;align-items:stretch}
.meter{background:#05080A;border:1px solid var(--line);border-radius:4px;padding:4px 10px;display:grid;line-height:1.2}
.meter small{font-family:var(--term);font-size:11px;color:var(--muted)}
.meter b{font-family:var(--mono);font-size:22px;font-weight:600;color:var(--danger);text-shadow:0 0 8px rgba(255,75,62,.6);font-variant-numeric:tabular-nums}
.meter.h b{color:var(--caution);text-shadow:0 0 8px rgba(255,181,46,.5)}
.penalty{color:var(--caution);font-family:var(--mono);font-size:11px}
.lamp{font-family:var(--term);font-size:12px;color:var(--muted);gap:3px}
.lamp i{height:6px;border-radius:1px;background:#3A1512;border:0;box-shadow:0 0 6px rgba(255,75,62,.35)}
.lamp em{font-style:normal;font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--danger)}
.lamp.now i{background:var(--caution);box-shadow:0 0 10px var(--caution);animation:blink 1s steps(2) infinite}
.lamp.now em{color:var(--caution)}
.lamp.now{color:var(--ink)}
.lamp.done i{background:var(--ok);box-shadow:0 0 10px var(--ok)}
.lamp.done em{color:var(--ok)}
.pieces{font-family:var(--term)}
.slot{background:#05080A;border:1px solid var(--line);border-radius:3px;font-family:var(--display);color:var(--caution);text-shadow:0 0 10px rgba(255,181,46,.7)}
.slot:empty::after{content:"_";color:#33424A;text-shadow:none;animation:blink 1.4s steps(2) infinite}
.slot.got{background:#120E04;border-color:var(--caution);box-shadow:inset 0 0 12px rgba(255,181,46,.18)}

/* zone monitor */
.room{background:var(--panel);border:1px solid var(--line);border-radius:6px;box-shadow:0 12px 36px rgba(0,0,0,.55),inset 0 0 60px rgba(0,0,0,.35);position:relative}
.room-head{background:linear-gradient(180deg,#121B20,#0E1519);border-bottom:1px solid var(--line)}
.headrow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.tag{font-family:var(--mono);color:var(--caution);letter-spacing:.14em}
.lock{font-family:var(--mono);font-size:11px;letter-spacing:.14em;padding:2px 8px;border-radius:3px;border:1px solid var(--danger);color:var(--danger)}
.lock::before{content:"● ";animation:blink 1s steps(2) infinite}
.lock.open{border-color:var(--ok);color:var(--ok)}
.lock.open::before{animation:none}
.room-head h2{font-size:clamp(22px,4.4vw,28px);color:var(--ink)}
.story{font-family:var(--term);font-size:15px;color:#B7C6CC;text-wrap:pretty}
.story::before{content:"> ";color:var(--signal)}
.mission{background:#120E04;border:1px solid rgba(255,181,46,.35);border-left:0;border-radius:4px;position:relative;padding-left:20px}
.mission::before{content:"";position:absolute;inset:0 auto 0 0;width:8px;border-radius:4px 0 0 4px;background:repeating-linear-gradient(-45deg,var(--caution) 0 6px,#111 6px 12px)}
.mission .lbl{color:var(--caution);letter-spacing:.18em}
.card,.mrow{background:var(--panel-2);border-color:var(--line);border-radius:4px}
.seg button{background:#0A0F12;border-color:#2E3E46;border-radius:3px;font-family:var(--term)}
.seg button[aria-pressed="true"]{background:var(--caution);border-color:var(--caution);color:#1A1200;box-shadow:0 0 12px rgba(255,181,46,.45)}
select,input[type=text]{background:#070B0D;border-color:#2E3E46;border-radius:3px;color:var(--ink)}
.data{background:#081014;border-color:#1F3A36;border-radius:4px;font-family:var(--term);color:#C3D2D6}
.data b{color:var(--signal);font-family:var(--mono)}
.opt{background:#0A0F12;border-color:#2E3E46;border-radius:4px}
.opt[aria-pressed="true"]{background:var(--caution-soft);border-color:var(--caution);color:var(--ink);box-shadow:0 0 0 1px var(--caution) inset}
.chip{background:var(--panel-2);border-radius:4px}
.seqline{border-color:#2E3E46;background:#070B0D;border-radius:4px}
.seqline .chip{background:var(--signal-soft);border-color:var(--signal)}
.btn{border:0;border-radius:8px;padding:10px 20px;font-family:var(--body);font-weight:700;letter-spacing:0;
  background:var(--caution);color:#1A1200;box-shadow:none}
#hint{background:transparent;border:1px solid rgba(255,181,46,.6)}
.btn.ghost{background:transparent;border:1px solid #3A4A52;color:var(--ink);font-weight:500;box-shadow:none}
#hint{border-color:rgba(255,181,46,.55);color:var(--caution)}
.fb{font-family:var(--term);border-radius:4px;display:grid;gap:2px;border:1px solid}
.fb.bad{background:var(--danger-soft);color:#FFB3AC;border-color:rgba(255,75,62,.5)}
.fb.good{background:var(--ok-soft);color:#A9F0D7;border-color:rgba(61,219,168,.45)}
.fbtag{font-family:var(--mono);font-size:12px;letter-spacing:.2em;display:block}
.fb.bad .fbtag{color:var(--danger)}
.fb.good .fbtag{color:var(--ok)}
.hintbox{background:#120E04;border:1px dashed rgba(255,181,46,.5);border-radius:4px;font-family:var(--term)}
.hintbox b{font-family:var(--mono);letter-spacing:.06em}
.explain{border-color:rgba(61,219,168,.45);border-radius:4px;background:#07110E}
.explain h3{background:var(--ok-soft);color:var(--ok);font-size:16px}
.explain ul{font-family:var(--term);color:#C9D6D2}
.reward{font-family:var(--term)}
.kmap{background-color:var(--sea);background-image:linear-gradient(rgba(61,219,168,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(61,219,168,.06) 1px,transparent 1px);background-size:22px 22px;border:1px solid #1F3A36;border-radius:4px}
.kmap .prov{stroke:#0B1A1E}
.kmap .prov[aria-pressed="true"]{fill:var(--caution);filter:drop-shadow(0 0 4px rgba(255,181,46,.6))}
.kmap .mark circle{fill:#05080A;stroke:var(--caution)}
.kmap .mark text{fill:var(--caution)}
.tymap .bg{stroke:#0B1A1E}
.tymap .half{fill:var(--caution);fill-opacity:.12;stroke:var(--caution)}
.tymap .half[aria-pressed="true"]{fill-opacity:.75}
.steps span{border-radius:3px;border-color:#2E3E46}

<body>

<div class="wrap">
  <header class="board" id="board" aria-label="상황판">
    <div class="board-top">
      <div class="brand"><small>한국지리 탐구 · 자연재해와 자연재해의 경감 대책</small><b>국민 재난 안전 상황실 <span class="pwr">비상 전원</span></b></div>
      <div class="meters"><div class="meter"><small>남은 시간</small><b id="clock">40:00</b></div><div class="meter h"><small>지원 요청 <span class="penalty" id="pen"></span></small><b id="hintCount">0</b></div></div>
    </div>
    <div class="lamps" id="lamps"></div>
    <div class="crew" id="crew" hidden></div>
    <div class="pieces"><span>비상구 암호</span><span class="slot" data-p="0"></span><span class="slot" data-p="1"></span><span class="slot" data-p="2"></span><span class="slot" data-p="3"></span></div>
  </header>
  <main id="stage"></main>
</div>

<script>
const ROOMS = [
  {short:"보안 검색대"},{short:"기상 관측실"},{short:"지도 분석실"},{short:"침수 조사실"},{short:"중앙 지휘실"},{short:"비상구"}
];
let S = {room:-1, step:0, solved:[], pieces:[], hints:0, start:null, end:null, shown:{}};
const $ = (s,el=document)=>el.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const lines = s => s;   // 문장은 이어서 쓰고, 화면 너비에 따라 자연스럽게 줄바꿈
/* 긴 문장이 애매하게 잘리지 않도록: 문장마다 줄을 나누고, 긴 문장은 쉼표에서 한 번 더 나눈다 */
const TIDY = ".story,.mission,.card p,.mrow p,.data,.explain li,.hintbox,.mcq .q,.opt,.chip,.alertmsg p,.rules li,.recap li,.fb,.reward > span:last-child";
const plain = h => h.replace(/<[^>]*>/g,"");
function splitLong(h){
  const L = plain(h).length; if(L<=38) return [h];
  const cands=[]; const re=/,\s/g; let m;
  while((m=re.exec(h))){ const before=h.slice(0,m.index+1);
    if((before.match(/<b>/g)||[]).length!==(before.match(/<\/b>/g)||[]).length) continue;   // 굵은 글씨 안은 자르지 않음
    if((before.match(/\(/g)||[]).length!==(before.match(/\)/g)||[]).length) continue;      // 괄호 안도 자르지 않음
    const p=plain(before).length/L; if(p>.3&&p<.75) cands.push([Math.abs(p-.5),m.index+1]); }
  if(!cands.length) return [h];
  cands.sort((a,b)=>a[0]-b[0]); const k=cands[0][1];
  return [h.slice(0,k), h.slice(k).trim()];
}
function tidy(root){
  root.querySelectorAll(TIDY).forEach(el=>{
    if(el.dataset.tidy) return; el.dataset.tidy="1";
    const keep = el.querySelector(":scope > .lbl"); const lbl = keep ? keep.outerHTML : "";
    let h = el.innerHTML; if(keep) h = h.replace(lbl,"");
    const parts = h.split(/<br\s*\/?>|(?<=[^\s(][.!?])\s+(?=[^\s<)])/).map(x=>x.trim()).filter(Boolean).flatMap(splitLong);
    if(parts.length<1) return;
    el.innerHTML = lbl + parts.map(x=>`<span class="ln">${x}</span>`).join("");
  });
}
new MutationObserver(()=>{ if(typeof gate==="function") gate(); }).observe(document.getElementById("stage"),{childList:true,subtree:true});
const shuffle = a => { a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]} return a; };

/* ---------- status board ---------- */
const crewText = () => (S.team||[]).map(esc).join(", ");
function drawBoard(){
  const cr=document.getElementById("crew"); if(cr){ cr.hidden=!(S.team&&S.team.length&&S.start); cr.innerHTML=`<span>근무자</span>${crewText()}`; }
  $("#lamps").innerHTML = ROOMS.map((r,i)=>{const st=S.solved.includes(i)?"done":(S.room===i?"now":""); return `<div class="lamp ${st}"><i></i>${r.short}<em>${st==="done"?"ONLINE":st==="now"?"복구 중":"LOCKED"}</em></div>`}).join("");
  document.querySelectorAll(".pieces .slot").forEach((el,i)=>{el.textContent=S.pieces[i]||"";el.classList.toggle("got",!!S.pieces[i]);});
  $("#hintCount").textContent = S.hints;
  $("#pen").textContent = S.hints ? `(+${S.hints*PEN}초)` : "";
}
/* ===== 구글 시트 기록 전송 =====
   선생님의 Apps Script 웹 앱 주소를 따옴표 안에 붙여 넣으면, 게임이 끝날 때 기록이 구글 시트로 자동 전송된다.
   예: const SHEET_URL = "https://script.google.com/macros/s/AKfy..../exec";   (비워 두면 전송하지 않음) */
const SHEET_URL = "https://script.google.com/macros/s/AKfycbzON3yLSXBN1IOKXeFS0BSj_Qf9O3ZlzaA_0ydG0UeXNIFoEjWDCCajEcOMd_Ba5SW3/exec";
function sendRecord(result){
  const el = document.getElementById("sendState");
  if(!SHEET_URL){ if(el) el.hidden = true; return; }          // 주소가 없으면 안내 문구도 숨김
  if(S.sent){ if(el) el.textContent = "본부로 기록을 전송했습니다."; return; }
  S.sent = true;
  const real = Math.floor(((S.end||S.overAt||Date.now())-S.start)/1000);
  const fails = Object.values(S.fails||{}).reduce((a,b)=>a+b,0);
  const mmss = t => `${Math.floor(t/60)}분 ${String(t%60).padStart(2,"0")}초`;
  const rec = { result, team:(S.team||[]).join(", "), real:mmss(real), penalty:S.hints*PEN, total:mmss(real+S.hints*PEN),
    remain:mmss(Math.max(0,LIMIT-real-S.hints*PEN)), hints:S.hints, fails, zones:S.solved.filter(i=>i<5).length, pieces:S.pieces.length };
  try{
    fetch(SHEET_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(rec)})
      .then(()=>{ if(el) el.textContent = "본부로 기록을 전송했습니다."; })
      .catch(()=>{ S.sent=false; if(el) el.innerHTML = `기록 전송에 실패했습니다. 인터넷 연결을 확인한 뒤 <button class="btn ghost" id="resend" type="button">다시 보내기</button>`; const r=document.getElementById("resend"); if(r) r.onclick=()=>sendRecord(result); });
  }catch(e){ S.sent=false; if(el) el.textContent = "기록 전송에 실패했습니다."; }
}
const PEN = 30;   // 힌트 1회당 경과 시간 페널티(초)
const LOCK = 15;  // 오답 시 보안 잠금(초)
/* 단계별 최소 분석 시간(초): 이 시간이 지나야 잠금 해제 버튼이 켜진다. 키 = "구역-단계-지도단계" (구역은 0부터) */
const MIN_TIME = {
  "0-0-0":60,                               // 구역1 보안 검색대: 사건 10개 분류
  "1-0-0":60, "1-1-0":60, "1-2-0":30,       // 구역2 기상 관측실: 이름표 8개 / 특보 6개 / 태풍
  "2-0-0":60, "2-1-0":30, "2-2-0":60,       // 구역3 지도 분석실: 자료 1~3 위치 찾기
  "2-0-1":30, "2-1-1":30, "2-2-1":30,       //                    자료 1~3 이름 연결
  "3-0-0":60, "3-1-0":60,                   // 구역4 침수 조사실: 원인 분류 / 대책 연결
  "4-0-0":60, "4-1-0":30, "4-2-0":60,       // 구역5 중앙 지휘실: 관리 체계+빈칸 / 학교 황사 / 행동 요령
  "5-0-0":30                                // 비상구
};
const stepKey = () => S.room+"-"+S.step+"-"+(S.r3phase||0);
const fmtLeft = t => t>=60 ? `${Math.floor(t/60)}분 ${String(t%60).padStart(2,"0")}초` : `${t}초`;
function gate(){
  const b=document.getElementById("check"); if(!b || S.room<0 || S.end || S.over) return;
  if(!b.dataset.label) b.dataset.label=b.textContent;
  S.stepStart=S.stepStart||{}; const k=stepKey();
  if(!S.stepStart[k]) S.stepStart[k]=Date.now();
  const dwell=Math.ceil((S.stepStart[k]+(MIN_TIME[k]||0)*1000-Date.now())/1000);
  const lock=Math.ceil(((S.lockUntil||0)-Date.now())/1000);
  const set=(dis,txt)=>{ if(b.disabled!==dis) b.disabled=dis; if(b.textContent!==txt) b.textContent=txt; };   // 바뀔 때만 써서 관찰자 무한 반복 방지
  if(lock>0) set(true,`보안 잠금 ${lock}초`);
  else if(dwell>0) set(true,`분석 중 · ${fmtLeft(dwell)} 후 해제 가능`);
  else set(false,b.dataset.label);
}
setInterval(gate,250);
const fmt = t => String(Math.floor(t/60)).padStart(2,"0")+":"+String(t%60).padStart(2,"0");
const LIMIT = 40*60;   // 제한 시간(초)
function tick(){
  if(!S.start){$("#clock").textContent=fmt(LIMIT);return;}
  const used = Math.floor(((S.end||S.overAt||Date.now())-S.start)/1000) + S.hints*PEN;
  const rem = Math.max(0, LIMIT-used);
  $("#clock").textContent = fmt(rem);
  $("#clock").parentElement.classList.toggle("warn", rem<=300 && !S.end);
  if(rem<=0 && !S.end && !S.over){ S.over=true; S.overAt=Date.now(); drawBoard(); timeOver(); }
}
setInterval(tick,1000);

/* ---------- shared room frame ---------- */
function frame({tag,title,story,body}){
  return `<section class="room"><div class="room-head"><div class="headrow"><span class="tag">${tag}</span><span class="lock" id="lockchip">LOCKED</span></div><h2>${title}</h2>${story?`<p class="story">${lines(story)}</p>`:""}</div><div class="room-body" id="rb">${body}</div></section>`;
}
function mission(t){return `<div class="mission"><span class="lbl">MISSION</span>${t}</div>`}
function controls(checkLabel="잠금 해제"){
  return `<div class="actions"><button class="btn" id="check">${checkLabel}</button><button class="btn ghost" id="hint">힌트 보기</button></div><div id="hintArea"></div><div id="fb" aria-live="polite"></div>`;
}
function wireHints(hints){
  const key = S.room+"-"+S.step;
  const render = ()=>{ const n=S.shown[key]||0;
    $("#hintArea").innerHTML = hints.slice(0,n).map((h,i)=>`<p class="hintbox"><b>본부 무전 ${i+1}</b> ${h}</p>`).join("");
    const b=$("#hint"); b.disabled = n>=hints.length; b.textContent = n>=hints.length?"지원 요청 소진":`본부 지원 요청 (+${PEN}초 · ${hints.length-n}회 남음)`; };
  $("#hint").onclick = ()=>{ S.shown[key]=(S.shown[key]||0)+1; S.hints++; drawBoard(); tick(); render(); };
  render();
}
function feedback(ok,total,msg){
  const fb=$("#fb");
  if(ok===true){fb.innerHTML=`<p class="fb good"><b class="fbtag">ACCESS GRANTED</b>${msg||"잠금이 풀렸습니다."}</p>`;return;}
  if(ok===false){ fb.innerHTML = `<p class="fb bad"><b class="fbtag">INPUT CHECK</b>${msg}</p>`; return; }   // 빈칸 등 입력 확인: 벌칙 없음
  S.fails=S.fails||{}; const fk=S.room+"-"+S.step+"-"+(S.r3phase||0); const n=S.fails[fk]=(S.fails[fk]||0)+1;
  const detail = n>=3 ? (msg || `${total}개 중 ${ok}개가 일치합니다.`) : `일치하지 않는 항목이 있습니다. (오류 ${n}회 · 3회째부터 일치 개수 표시)`;
  S.lockUntil = Date.now()+LOCK*1000;
  fb.innerHTML = `<p class="fb bad"><b class="fbtag">ACCESS DENIED · 접근 거부</b>${detail} 보안 시스템이 ${LOCK}초 동안 잠깁니다.</p>`;
  const r=$(".room"); r.classList.remove("shake"); void r.offsetWidth; r.classList.add("shake");
}
function solveRoom(piece, title, points){
  if(!S.solved.includes(S.room)) S.solved.push(S.room);
  if(piece && !S.pieces.includes(piece)) S.pieces.push(piece);
  drawBoard();
  const lk=$("#lockchip"); if(lk){lk.textContent="UNLOCKED";lk.classList.add("open");}
  $("#rb").innerHTML = `<p class="fb good"><b class="fbtag">ACCESS GRANTED</b>${S.room<5?`구역 ${S.room+1} 시스템 복구 완료.`:""}</p>
    <div class="explain"><h3>복구 보고서 · ${title}</h3><ul>${points.map(p=>`<li>${p}</li>`).join("")}</ul>
    ${piece?`<div class="reward"><span class="slot got">${piece}</span><span>비상구 암호 조각 <b>‘${piece}’</b> 확보.</span></div>`:`<div class="reward"><span>비상구에 전원이 들어왔습니다. 비상구로 이동하세요.</span></div>`}</div>
    <div class="actions"><button class="btn" id="next">${S.room===4?"비상구로 이동":"다음 구역으로"}</button></div>`;
  $("#next").onclick = ()=>go(S.room+1);
  $("#rb").scrollIntoView({behavior:"smooth",block:"start"});
}
function go(r){ S.lockUntil=0; S.room=r; S.step=0; S.r3phase=0; S.r3sel=null; S.r2side=null; drawBoard(); render(); window.scrollTo({top:0,behavior:"smooth"}); }

/* ---------- intro ---------- */
function intro(){
  $("#stage").innerHTML = `<section class="room"><div class="hero">
    <span class="tag">2026. 8. 10. 14:17 · 비상 전원 가동</span>
    <h1>상황실에 <em>갇혔다</em></h1>
    <div class="alertmsg" role="alert"><div class="am-top"><b>긴급 재난 문자</b><span>8월 10일(월) 오후 2:17</span></div>
      <p>[행정안전부] 오늘 14:10 태풍 북상으로 국민 재난 안전 상황실 일대에 정전 발생, 보안 시스템이 잠겼습니다. 근무자는 5개 구역의 시스템을 복구한 뒤 비상구 암호를 찾아 대피하시기 바랍니다.</p></div>
    <p class="story">당신은 이번 여름 국민 재난 안전 상황실에 배치된 신입 연구원입니다. 태풍으로 전력이 끊기면서 보안 시스템이 잠겨 상황실에 갇혔습니다. 구역마다 시스템을 복구하면 비상구 <b>암호 조각</b>이 하나씩 나옵니다. 조각 4개를 모아 비상구를 열고 탈출하세요.</p>
    <div class="rules-box"><b>상황실 비상 수칙</b>
    <ol class="rules"><li>정전으로 자료실 문이 잠겼습니다. 교과서와 학습지 없이 여러분이 기억하고 있는 지식만으로 시스템을 복구해야 합니다.</li><li>제한 시간은 40분입니다. 남은 시간이 0이 되면 상황실 전력이 완전히 끊겨 탈출에 실패합니다.</li><li>본부 지원 요청(힌트)은 단계마다 2번까지 보낼 수 있습니다. 요청할 때마다 남은 시간이 ${PEN}초씩 줄어듭니다.</li><li>잘못된 답을 입력하면 보안 시스템이 ${LOCK}초 동안 잠깁니다. 같은 문제에서 3번째 오류부터는 맞은 개수를 알려 줍니다.</li><li>각 단계마다 자료 분석 시간이 주어집니다. 분석 시간이 끝나야 잠금 해제 버튼이 활성화됩니다.</li></ol></div>
    <div class="crewbox">
      <label class="crewq" for="nm-0">당신의 이름은 무엇입니까?</label>
      <p class="crewsub">근무자 출입 등록: 모둠원 모두의 이름을 적어 주세요.</p>
      <div class="crewlist" id="crewlist"></div>
      <button class="btn ghost" id="addCrew" type="button">+ 모둠원 추가</button>
    </div>
    <div class="actions"><button class="btn" id="startBtn">복구 작업 시작</button></div>
    <div id="fb" aria-live="polite"></div>
  </div></section>`;
  const names = (S.team && S.team.length) ? [...S.team] : ["","","",""];
  while(names.length<4) names.push("");
  const drawCrew=()=>{ $("#crewlist").innerHTML = names.map((n,i)=>`<input type="text" id="nm-${i}" data-i="${i}" maxlength="12" autocomplete="off" placeholder="모둠원 ${i+1}" aria-label="모둠원 ${i+1} 이름" value="${esc(n)}">`).join("");
    document.querySelectorAll("#crewlist input").forEach(inp=>inp.oninput=()=>{names[+inp.dataset.i]=inp.value;});
    $("#addCrew").hidden = names.length>=6; };
  $("#addCrew").onclick=()=>{ if(names.length<6){ names.push(""); drawCrew(); $("#nm-"+(names.length-1)).focus(); } };
  drawCrew();
  $("#startBtn").onclick = ()=>{
    const team = names.map(n=>n.trim()).filter(Boolean);
    if(!team.length){ $("#fb").innerHTML=`<p class="fb bad"><b class="fbtag">INPUT CHECK</b>출입 등록을 하려면 이름을 한 명 이상 적어 주세요.</p>`; $("#nm-0").focus(); return; }
    S.team = team; S.q=null; buildQuestions(); S.start=Date.now(); go(0); };
}

/* ---------- room 1: 자연 현상 vs 자연재해 ---------- */
function room1(){
  const order = S.r1 || (S.r1 = shuffle(R1.map((_,i)=>i)));
  const pick = {};
  $("#stage").innerHTML = frame({tag:"구역 1 / 5",title:"보안 검색대",
    story:"출입 시스템을 통과하기 위해서는 모든 사건 기록을 다시 분류해야 합니다.",
    body: mission("각 사건이 <b>자연 현상</b>인지 <b>자연재해</b>인지 고르세요.") +
      `<div class="cards">${order.map(i=>`<div class="card"><p>${R1[i].t}</p><div class="seg" data-i="${i}"><button aria-pressed="false" data-v="현상">자연 현상</button><button aria-pressed="false" data-v="재해">자연재해</button></div></div>`).join("")}</div>` + controls()});
  document.querySelectorAll(".seg").forEach(seg=>seg.onclick=e=>{const b=e.target.closest("button");if(!b)return;
    seg.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b));pick[seg.dataset.i]=b.dataset.v;});
  wireHints(["사람에게 인적·물적 피해가 생겼는지만 따져 보세요. 현상 자체가 크고 작은 것은 상관없어요.","사람이 없는 곳을 지나간 태풍은 피해를 입은 대상이 없어요."]);
  $("#check").onclick=()=>{
    if(Object.keys(pick).length<R1.length) return feedback(false,0,"아직 고르지 않은 사건이 있어요.");
    const c = R1.filter((r,i)=>pick[i]===r.a).length;
    if(c===R1.length) solveRoom("무","자연 현상과 자연재해",[
      "<b>자연 현상</b>: 인간의 간섭이나 의지와 상관없이 자연에서 발생하는 모든 현상",
      "<b>자연재해</b>: 자연 현상이 인간 생활에 인적·물적 피해를 주는 것",
      "같은 비라도 산불 진화에는 도움이 되고(자연 현상), 짧은 시간에 집중되면 재해가 된다(자연재해).",
      "자연재해의 피해 정도는 지표 조건, 사회·경제적 조건 등에 따라 다르다."]);
    else feedback(c,R1.length);
  };
}

/* ---------- room 2: 기후적 요인에 의한 자연재해 ---------- */
/* 태풍 진로도: 남해상에서 북동쪽으로 진행하는 태풍. C=중심, D=진행 방향 */
const TY = {C:[150,430], D:[0.5,-0.866], r:52};
function typhoonSvg(side){
  const [cx,cy]=TY.C,[dx,dy]=TY.D,r=TY.r;
  const A=[cx+dx*r,cy+dy*r], B=[cx-dx*r,cy-dy*r];
  const half=(sw,name)=>`<path class="half" data-side="${name}" aria-pressed="${side===name}" tabindex="0" role="button" aria-label="${name==="R"?"진행 방향 오른쪽":"진행 방향 왼쪽"} 반원" d="M${A[0]} ${A[1]} A${r} ${r} 0 0 ${sw} ${B[0]} ${B[1]} Z"></path>`;
  const land=Object.values(KMAP.r).map(v=>`<path class="bg" d="${v.d}"></path>`).join("");
  return `<svg class="kmap tymap" viewBox="-20 60 330 560" role="group" aria-label="태풍 진로도">
    ${land}
    <path class="track" d="M40 600 C 90 540, 130 470, 150 430 S 230 300, 290 240" marker-end="url(#arr)"></path>
    <defs><marker id="arr" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" class="arrhead"></path></marker></defs>
    ${half(1,"R")}${half(0,"L")}
    <circle class="eye" cx="${cx}" cy="${cy}" r="6"></circle>
    <text class="sea" x="250" y="235">진행 방향</text>
  </svg>`;
}
function room2(){
  if(S.step===0){
    const order = S.r2 || (S.r2 = shuffle(R2A.map((_,i)=>i)));
    const names = ["황사","호우","홍수","가뭄","태풍","폭염","폭설","한파"];
    $("#stage").innerHTML = frame({tag:"구역 2 / 5 · 1단계",title:"기상 관측실",
      story:"출입 시스템을 통과했더니 기상 관측실이 나왔습니다. 기상 관측실을 살펴보니 관측 장비의 이름표가 바닥에 떨어져 있습니다. 설명을 읽은 후 관측 장비에 알맞은 이름표를 붙여야 합니다.",
      body: mission("이름이 겹치지 않도록 각 설명에 맞는 <b>기후적 요인에 의한 자연재해</b>를 고르세요.") +
      `<div class="match">${order.map(i=>`<div class="mrow"><p>${R2A[i].t}</p><select id="m${i}" aria-label="재해 이름"><option value="">선택</option>${names.map(n=>`<option>${n}</option>`).join("")}</select></div>`).join("")}</div>` + controls()});
    wireHints(["호우는 ‘비가 많이 내리는 것’, 홍수는 ‘하천이 넘쳐 물에 잠기는 것’이에요.","겨울 재해 두 가지: 기온이 떨어지면 한파, 눈이 쌓이면 폭설. 비가 안 와서 생기는 재해는 가뭄이에요."]);
    $("#check").onclick=()=>{
      const v=R2A.map((r,i)=>$("#m"+i).value);
      if(v.includes("")) return feedback(false,0,"아직 비어 있는 이름표가 있어요.");
      const c=R2A.filter((r,i)=>v[i]===r.n).length;
      if(c===R2A.length){S.step=1;room2();} else feedback(c,R2A.length);
    };
  } else if(S.step===1){
    const opts=["특보 없음","폭염 주의보","폭염 경보","호우 주의보"];
    $("#stage").innerHTML = frame({tag:"구역 2 / 5 · 2단계",title:"특보 발령기",
      story:"이름표를 붙이자 특보 발령기가 켜졌습니다. 관측실 문을 열기 위해서는 예보를 보고 알맞은 특보를 내려야 합니다.",
      body: mission("각 예보에 내려야 할 <b>특보</b>를 고르세요.") +
      `<div class="match">${R2B.map((r,i)=>`<div class="mrow"><p>${r.t}</p><select id="b${i}" aria-label="특보"><option value="">선택</option>${opts.map(n=>`<option>${n}</option>`).join("")}</select></div>`).join("")}</div>` + controls()});
    wireHints(["폭염 주의보: 일 최고 기온 33℃ 이상이 2일 이상 지속 예상 / 폭염 경보: 35℃ 이상이 2일 이상 지속 예상","호우 주의보: 3시간 강우량 60mm 이상 또는 12시간 강우량 110mm 이상 예상"]);
    $("#check").onclick=()=>{
      const v=R2B.map((r,i)=>$("#b"+i).value);
      if(v.includes("")) return feedback(false,0,"아직 고르지 않은 예보가 있어요.");
      const c=R2B.filter((r,i)=>v[i]===r.a).length;
      if(c===R2B.length){S.step=2;room2();} else feedback(c,R2B.length);
    };
  } else {
    let side=S.r2side||null;
    $("#stage").innerHTML = frame({tag:"구역 2 / 5 · 3단계",title:"태풍 감시 화면",
      story:"특보를 내리자마자 태풍 감시 화면에 경고등이 켜졌습니다. 남해상에서 태풍이 북동쪽으로 올라오고 있습니다. 태풍의 정체와 피해가 더 큰 쪽을 정확히 입력해야 관측실 문이 열립니다.",
      body: mission("빈칸을 채우고, 진로도에서 <b>피해가 더 큰 반원</b>을 누르세요.") +
      `<div class="mapbox"><div style="display:grid;gap:12px;min-width:0">
        <div class="mrow"><p>태풍은 중심 부근의 최대 풍속이 <b>(가)</b> 이상으로 폭풍우를 동반하는 열대 <b>(나)</b>이다.</p><div style="display:grid;gap:6px">
          <select id="ty1" aria-label="(가)"><option value="">(가) 선택</option><option>7m/s</option><option>17m/s</option><option>33m/s</option></select>

    $("#check").onclick=()=>{
      const a=$("#ty1").value,b=$("#ty2").value,c3=$("#ty3").value;
      if(!a||!b||!c3||!side) return feedback(false,0,"빈칸을 모두 채우고, 진로도에서 반원도 하나 눌러 주세요.");
      const c=[a==="17m/s",b==="저기압",side==="R",c3==="위험 반원"].filter(Boolean).length;
      if(c===4) solveRoom("환","기후적 요인에 의한 자연재해",[
        "기후적 요인에 의한 재해: 황사, 호우, <b>홍수</b>, <b>가뭄</b>, <b>태풍</b>, <b>폭염</b>, 폭설, 한파",
        "우리나라는 매년 강수량 변동 폭이 커서 기상 재해의 발생 횟수와 피해 정도가 해마다 다르다.",
        "<b>호우와 태풍</b>의 영향으로 <b>여름철</b> 자연재해 피해가 가장 많다. (대설 12~3월, 호우 6~8월, 태풍 8~9월)",
        "태풍: 중심 부근 최대 풍속 17m/s 이상의 열대 저기압. 진행 방향의 오른쪽(<b>위험 반원</b>)이 왼쪽(<b>가항 반원</b>)보다 피해가 크다.",
        "태풍은 바다에서 위력이 강해 내륙보다 섬과 해안 지역에 더 큰 피해를 주고, 강풍으로 해일이 일어나기도 한다.",
        "폭염 주의보 33℃·경보 35℃ (2일 이상 지속 예상), 호우 주의보는 3시간 60mm 또는 12시간 110mm 이상 예상"]);
      else feedback(c,4,`4개 중 ${c}개가 맞았어요. 빈칸과 반원을 다시 확인해 보세요.`);
    };
  }
}

const FULLNAME = {"서울":"서울특별시","부산":"부산광역시","대구":"대구광역시","인천":"인천광역시","광주":"광주광역시","대전":"대전광역시","울산":"울산광역시","세종":"세종특별자치시",
  "경기":"경기도","강원":"강원도","충북":"충청북도","충남":"충청남도","전북":"전라북도","전남":"전라남도","경북":"경상북도","경남":"경상남도","제주":"제주특별자치도"};
function mapSvg(sel, labels){
  const r=KMAP.r;
  const paths=Object.keys(r).map(n=>`<path class="prov" data-n="${n}" d="${r[n].d}" aria-pressed="${sel.includes(n)}" tabindex="0" role="button" aria-label="지역"></path>`).join("");
  const marks=sel.map((n,i)=>{const [x,y]=r[n].c;return `<g class="mark"><circle cx="${x}" cy="${y}" r="9"></circle><text x="${x}" y="${y+3.6}">${i+1}</text></g>`}).join("");
  return `<svg class="kmap" viewBox="-30 -4 ${KMAP.w+60} ${KMAP.h+8}" role="group" aria-label="대한민국 시도 지도">
    <text class="sea" x="0" y="250">황해</text><text class="sea" x="${KMAP.w-14}" y="150">동해</text><text class="sea" x="170" y="400">남해</text>
    ${paths}${marks}</svg>`;
}
function room3(){
  const st=R3[S.step];
  const phase = S.r3phase||0;              // 0: 지도에서 고르기, 1: 이름 연결
  const sel = S.r3sel || (S.r3sel=[]);
  const stepsHtml = `<div class="steps">${R3.map((_,i)=>`<span class="${i<S.step?"ok":i===S.step?"on":""}">자료 ${i+1}</span>`).join("")}</div>`;
  const allNames = Object.values(FULLNAME);
  const nameRows = phase===1 ? `<div class="match">${sel.map((n,i)=>`<div class="mrow"><p><b>${i+1}번</b> 지역의 이름은?</p><select id="nm${i}" aria-label="${i+1}번 지역 이름"><option value="">선택</option>${allNames.map(f=>`<option>${f}</option>`).join("")}</select></div>`).join("")}</div>` : "";
  $("#stage").innerHTML = frame({tag:`구역 3 / 5 · 자료 ${S.step+1}`,title:"지도 분석실",
    story:"분석 화면에 재해 통계만 남고 지역 이름이 모두 지워졌습니다. 단서를 읽고 지도에서 지역을 찾은 뒤, 지역 이름을 다시 연결하세요.",
    body: stepsHtml + mission(phase===0? st.m : "지도에 표시된 <b>번호</b>에 맞게 지역 이름을 연결하세요.") +
    `<div class="mapbox"><div style="display:grid;gap:12px;min-width:0"><div class="data">${st.data}</div><p class="namenote">※ 지역 이름은 통계 기간(2012~2021년) 당시의 행정 구역 명칭을 기준으로 합니다. (강원도는 2023년 강원특별자치도, 전라북도는 2024년 전북특별자치도로 바뀜)</p>${nameRows}</div><div>${mapSvg(sel)}${phase===0?`<p class="mapnote">지역을 누르면 선택, 한 번 더 누르면 취소 (${sel.length}/${st.need.length})</p>`:""}<p class="mapnote">※ 울릉도·독도 등 일부 섬은 지도에서 생략했습니다.</p></div></div>` +
    controls(phase===0?"위치 확정":"이름 확정")});
  if(phase===0){
    document.querySelectorAll(".prov").forEach(p=>{
      const toggle=()=>{const n=p.dataset.n; const k=sel.indexOf(n);
        if(k>=0) sel.splice(k,1); else { if(st.need.length===1) sel.length=0; if(sel.length<st.need.length) sel.push(n); }
        const fb=$("#fb").innerHTML; room3(); $("#fb").innerHTML=fb; };
      p.onclick=toggle; p.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();toggle();}};
    });
  }
  wireHints(st.hints);
  $("#check").onclick=()=>{
    if(phase===0){
      if(sel.length!==st.need.length) return feedback(false,0,`지역을 ${st.need.length}곳 골라야 해요. 지금 ${sel.length}곳을 골랐어요.`);
      const c=st.need.filter(n=>sel.includes(n)).length;
      if(c===st.need.length){ S.r3phase=1; room3(); $("#fb").innerHTML=`<p class="fb good"><b class="fbtag">POSITION CONFIRMED</b>위치가 모두 맞았습니다. 이제 이름을 연결하세요.</p>`; }
      else feedback(c,st.need.length,st.need.length===1?"이 지역이 아니에요. 단서를 다시 읽어 보세요.":`${st.need.length}곳 중 ${c}곳이 맞았어요. 다시 확인해 보세요.`);
      return;
    }
    const v=sel.map((n,i)=>$("#nm"+i).value);
    if(v.includes("")) return feedback(false,0,"아직 이름을 고르지 않은 번호가 있어요.");
    const c=sel.filter((n,i)=>v[i]===FULLNAME[n]).length;
    if(c===sel.length){
      S.r3phase=0; S.r3sel=null;
      if(S.step<R3.length-1){S.step++;room3();}
      else solveRoom("유","우리나라 자연재해의 지역 분포",[
        "<b>태풍</b> 피해 상위: 전라남도, 경상북도, 경상남도. 열대 해상에서 발생해 북상하므로 남부 지방의 내습 빈도가 높다.",
        "<b>호우</b> 피해 상위: 충청북도, 전라남도, 경기도, 강원도. 다우지인 남부 지방과 여름철 강수 집중률이 높은 한강 중상류 지방의 피해가 크다.",
        "<b>지진</b> 피해: 경상북도가 99.2%. 2016년 경주 지진과 2017년 포항 지진의 영향",
        "지형적 요인에 의한 재해: <b>지진</b>, 화산, <b>산사태</b>",
        "지진·화산: 지각판이 충돌하거나 분리되며 나타나고 판의 경계(예: 환태평양 조산대)에서 주로 발생한다. 대책은 내진 설계 강화, 지진 발생 시 행동 요령 교육 등",
        "산사태: 자연적 또는 인위적 원인으로 산지가 일시에 붕괴하는 것. 최근 도시화 과정에서 산지 난개발이 이루어진 곳에서 많이 발생한다."]);
    } else feedback(c,sel.length,`${sel.length}개 중 ${c}개 이름이 맞았어요. 다시 확인해 보세요.`);
  };
}

function room4(){
  if(S.step===0){
  const order = S.r4 || (S.r4 = shuffle(R4.map((_,i)=>i)));
  const pick={};
  $("#stage").innerHTML = frame({tag:"구역 4 / 5 · 1단계",title:"침수 조사실",
    story:"침수 조사실 모니터에 과거 사건 파일 하나가 열려 있습니다. 2022년 8월 8일, 기록적인 폭우로 서울특별시 강남구 일대가 침수된 사건입니다. 도로와 지하철이 멈추고, 하수가 역류했습니다. 그런데 정전 충격으로 파일 속 침수 원인 목록이 뒤섞여 버렸습니다. 원인을 바르게 다시 정리해야 조사실 안쪽의 대책 수립 회의실로 들어갈 수 있습니다.",
    body: mission("각 항목이 침수의 <b>자연적 원인</b>인지, <b>인위적 원인</b>인지, 아니면 <b>원인이 아닌지</b> 분류하세요.") +
    `<div class="cards">${order.map(i=>`<div class="card"><p>${R4[i].t}</p><div class="seg" data-i="${i}"><button aria-pressed="false" data-v="자연">자연적 원인</button><button aria-pressed="false" data-v="인위">인위적 원인</button><button aria-pressed="false" data-v="없음">원인 아님</button></div></div>`).join("")}</div>` + controls()});
  document.querySelectorAll(".seg").forEach(seg=>seg.onclick=e=>{const b=e.target.closest("button");if(!b)return;
    seg.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b));pick[seg.dataset.i]=b.dataset.v;});
  wireHints(["실제 원인은 5개예요. 나머지 3개는 이 사건과 관계없는 다른 재해의 내용이에요.","자연적 원인은 2개예요. 비가 많이 온 것, 그리고 원래 땅이 낮은 것."]);
  $("#check").onclick=()=>{
    if(Object.keys(pick).length<R4.length) return feedback(false,0,"아직 분류하지 않은 항목이 있어요.");
    const c=R4.filter((r,i)=>pick[i]===r.a).length;
    if(c===R4.length){S.step=1;room4();} else feedback(c,R4.length);
  };
  } else {
    const order = S.r4m || (S.r4m = shuffle(R4M.map((_,i)=>i)));
    const opts = S.r4o || (S.r4o = shuffle(R4M.map(r=>r.a)));
    $("#stage").innerHTML = frame({tag:"구역 4 / 5 · 2단계",title:"대책 수립 회의실",
      story:"침수 원인을 정리하자 조사실 안쪽에 있는 대책 수립 회의실의 문이 열렸습니다. 회의실 화면에는 도시 홍수뿐만 아니라 산사태와 지진 피해 상황도 함께 떠 있습니다. 피해 상황마다 알맞은 경감 대책을 연결해야 침수 조사실 시스템이 복구됩니다.",
      body: mission("대책이 겹치지 않도록 각 피해 상황에 알맞은 <b>자연재해 경감 대책</b>을 고르세요.") +

    $("#check").onclick=()=>{
      const v=R4M.map((r,i)=>$("#d"+i).value);
      if(v.includes("")) return feedback(false,0,"아직 고르지 않은 대책이 있어요.");
      const c=R4M.filter((r,i)=>v[i]===r.a).length;

        "산사태 대책: 사방 댐 설치, 산비탈 식생·섬유 매트로 토양 유실 방지, 취약 지역 사전 점검 / 지진 대책: 내진 설계 강화",

/* ---------- room 5: 재난 관리 체계 + 행동 요령 ---------- */
const R5S = [
  {k:"1단계 · 예방·대비", t:"실외 수업 대체 계획을 마련하고, 황사 마스크·상비약을 준비하며, 안전 교육을 실시한다."},
  {k:"2단계 · 황사 주의보 발령", t:"등하교 시간 조정 등 학사 운영을 검토하고, 상황 보고 및 응급조치를 실시한다."},
  {k:"3단계 · 황사 경보 발령", t:"안전 교육과 학사 운영 조정 검토, 상황 보고 및 응급조치를 지속한다."},
  {k:"4단계 · 후속 조치", t:"실내외 방역 및 청소를 하고, 피해 학생과 교직원 상황을 파악한 후 사후 조치를 실시한다."}
];
function seqRoom({tag,title,story,missionHtml,items,orderKey,hints,extraHtml="",extraCheck,next}){
  const order = S[orderKey] || (S[orderKey] = shuffle(items.map((_,i)=>i)));
  let line=[];
  $("#stage").innerHTML = frame({tag,title,story,
    body: mission(missionHtml) +
    `<div class="seqline" id="line"></div><div class="seqpool">${order.map(i=>`<button class="chip" data-i="${i}">${items[i].t}</button>`).join("")}</div>
     <div class="actions"><button class="btn ghost" id="reset">다시 놓기</button></div>` + extraHtml + controls()});
  const draw=()=>{ $("#line").innerHTML = line.map(i=>`<div class="chip"><span>${items[i].t}</span></div>`).join("");
    document.querySelectorAll(".seqpool .chip").forEach(b=>b.disabled=line.includes(+b.dataset.i)); };
  document.querySelectorAll(".seqpool .chip").forEach(b=>b.onclick=()=>{line.push(+b.dataset.i);draw();});
  $("#reset").onclick=()=>{line=[];draw();$("#fb").innerHTML="";};
  wireHints(hints);
  $("#check").onclick=()=>{
    if(line.length<items.length) return feedback(false,0,`카드 ${items.length}장을 모두 놓아 주세요.`);
    const c=line.filter((v,i)=>v===i).length;
    const ex = extraCheck ? extraCheck() : true;
    if(ex===null) return feedback(false,0,"빈칸을 채워 주세요.");
    if(c===items.length && ex) next();
    else if(c===items.length) feedback(false,0,"순서는 모두 맞았어요! 빈칸에 들어갈 말을 다시 확인해 보세요.");
    else feedback(c,items.length,`${items.length}칸 중 ${c}칸이 제자리에 있어요. ‘다시 놓기’를 눌러 순서를 바꿔 보세요.${extraCheck&&ex?" (빈칸은 맞았어요.)":""}`);
  };
}
function room5(){
  if(S.step===0){
    seqRoom({tag:"구역 5 / 5 · 1단계",title:"중앙 지휘실",
      story:"지휘실의 재난 대응 매뉴얼 페이지가 흩어졌습니다. 국가 재난 관리 체계를 순서대로 다시 묶어야 합니다. 매뉴얼 속 지워진 명칭도 채워야 합니다.",
      missionHtml:"국가 재난 관리 단계를 <b>일어나는 순서대로</b> 누른 뒤, 카드 속 <b>빈칸에 들어갈 명칭</b>을 쓰세요.",
      items:R5A, orderKey:"r5",
      extraHtml:`<div class="mrow"><p><b>빈칸</b>에 들어갈 명칭</p><input id="org" type="text" autocomplete="off" placeholder="띄어쓰기는 상관없어요" aria-label="빈칸에 들어갈 명칭"></div>`,
      extraCheck:()=>{const v=$("#org").value.replace(/\s/g,""); if(!v) return null; return v===R5BLANK.ans;},
      hints:["재난이 일어나기 전에 하는 일이 맨 앞이에요. 긴급 재난 문자는 재난이 막 시작될 때 보내요.",R5BLANK.hint],
      next:()=>{S.step=1;room5();}});
  } else if(S.step===1){
    seqRoom({tag:"구역 5 / 5 · 2단계",title:"학교 재난 관리실",
      story:"지휘실 옆 학교 재난 관리실의 화면이 켜졌습니다. 황사가 다가오고 있습니다. 학교의 황사 대응 단계를 순서대로 정리해야 다음 문이 열립니다.",
      missionHtml:"<b>황사 발생 시 학교 조치 사항</b>을 1단계부터 4단계까지 순서대로 누르세요.",
      items:R5S, orderKey:"r5s",
      hints:["준비 → 주의보 → 경보 → 뒷정리 순서예요.","경보는 주의보보다 심각할 때 내려요. 방역·청소는 황사가 지나간 뒤에 해요."],
      next:()=>{S.step=2;room5();}});
  } else {
    const pick={};
    $("#stage").innerHTML = frame({tag:"구역 5 / 5 · 3단계",title:"대피 훈련 시뮬레이터",
      story:"마지막 관문입니다. 학교 안전 지원 시스템의 행동 요령대로 움직여야 비상구 전원이 켜집니다.",
      body: mission("각 상황에서 할 수 있는 <b>올바른 행동 요령</b>을 고르고, O/X 문제에도 답하세요.") +
      R5B.map((r,i)=>`<div class="mcq${r.ox?" ox":""}" data-i="${i}"><p class="q">${r.ox?"":`상황 ${i+1}. `}${r.q}</p><div class="${r.ox?"oxrow":"mcq"}">${r.o.map((o,j)=>`<button class="opt" aria-pressed="false" data-j="${j}">${o}</button>`).join("")}</div></div>`).join("") + controls()});
    document.querySelectorAll(".room-body > .mcq").forEach(m=>m.onclick=e=>{const b=e.target.closest(".opt");if(!b)return;
      m.querySelectorAll(".opt").forEach(x=>x.setAttribute("aria-pressed",x===b));pick[m.dataset.i]=+b.dataset.j;});
    wireHints(["지진은 책상 아래, 산불은 바람을 등지고, 산사태는 높은 곳으로 대피해요.","O/X는 국가 재난 관리 체계(예방 → 초기 대응 → 비상 대응 → 수습·복구)와 학교 황사 4단계를 떠올려 보세요. 재해 연보 발행은 예방 조치에 해당해요."]);
    $("#check").onclick=()=>{
      if(Object.keys(pick).length<R5B.length) return feedback(false,0,"아직 답하지 않은 문제가 있어요.");
      const c=R5B.filter((r,i)=>pick[i]===r.a).length;
      if(c===R5B.length) solveRoom(null,"자연재해의 대응 방법",[
        "국가 재난 관리 체계: <b>예방 조치</b> → 대응 조치(<b>초기</b>: 위기 경보·긴급 재난 문자 → <b>비상</b>: <b>재난 안전 대책 본부</b> 구성·현장 지휘소 설치) → <b>수습 및 복구 조치</b>",
        "학교 재난 관리 체계(황사): 1단계 실외 수업 대체 계획·안전 교육 → 2단계 학사 운영 검토·상황 보고 → 3단계 안전 교육·응급조치 지속 → 4단계 방역·청소·사후 조치",
        "국민 재난 안전 포털: 재난의 예방 및 대비, 안전 보험, 심리 상담 등의 내용을 담고 있음 / 재해 연보 발행은 예방 조치에 해당",
        "지진: 책상 아래에서 머리 보호 → 흔들림이 멈추면 계단으로 운동장 등에 대피",
        "산불: 119 신고, 젖은 수건으로 코와 입을 막고 바람을 등진 방향으로 / 산사태: 119 신고 후 높은 곳으로",
        "황사: 외출 시 마스크, 수분 섭취, 귀가 후 손·얼굴 씻기 / 폭염: 더운 시간대 야외 활동 자제 / 대설: 미끄러운 신발과 위험 지역 피하기 / 화산 폭발: 코와 입을 막고 오염된 옷 세탁"]);
      else feedback(c,R5B.length);
    };
  }
}

/* ---------- final door ---------- */
function finalDoor(){
  const tiles = S.fd || (S.fd = shuffle(["유","비","무","환"]));
  let put=[];
  $("#stage").innerHTML = frame({tag:"비상구",title:"마지막 잠금장치",
    story:"비상구에 네 칸짜리 잠금장치가 있습니다. 모은 암호 조각을 바른 순서로 넣으세요.",
    body:`<div class="door">
      <p class="mission" style="border-left-color:var(--danger)"><span class="lbl" style="color:var(--danger)">비상구 문구</span>“대비 못하면 자연재해, 대비 잘하면 자연 현상”이라는 문구를 보고, 미리 준비해 두면 걱정할 일이 없다는 뜻의 사자성어를 완성하세요.</p>
      <div class="lockslots" id="lock">${[0,1,2,3].map(()=>`<span class="slot"></span>`).join("")}</div>
      <div class="tiles" id="tiles">${tiles.map((t,i)=>`<button data-i="${i}" aria-label="조각 ${t}">${t}</button>`).join("")}</div>
      <div class="actions" style="justify-content:center"><button class="btn ghost" id="reset">다시 넣기</button><button class="btn" id="check">문 열기</button><button class="btn ghost" id="hint">힌트 보기</button></div>
      <div id="hintArea"></div><div id="fb" aria-live="polite"></div></div>`});
  const draw=()=>{ document.querySelectorAll("#lock .slot").forEach((s,i)=>{s.textContent=put[i]!=null?tiles[put[i]]:"";s.classList.toggle("got",put[i]!=null);});
    document.querySelectorAll("#tiles button").forEach(b=>b.disabled=put.includes(+b.dataset.i)); };
  document.querySelectorAll("#tiles button").forEach(b=>b.onclick=()=>{if(put.length<4){put.push(+b.dataset.i);draw();}});
  $("#reset").onclick=()=>{put=[];draw();$("#fb").innerHTML="";};
  wireHints(["有備無患: 있을 유, 갖출 비, 없을 무, 근심 환","‘준비가 있으면(□□) 근심이 없다(□□)’"]);
  $("#check").onclick=()=>{
    if(put.length<4) return feedback(false,0,"네 칸을 모두 채워 주세요.");
    if(put.map(i=>tiles[i]).join("")==="유비무환"){ S.solved.push(5); S.end=Date.now(); drawBoard(); tick(); ending(); }
    else { const c=put.filter((v,i)=>tiles[v]==="유비무환"[i]).length; feedback(c,4,`문이 꿈쩍도 하지 않아요. 4칸 중 ${c}칸이 맞아요.`); }
  };
}

/* ---------- ending ---------- */
function ending(){
  const real=Math.floor((S.end-S.start)/1000), t=real+S.hints*PEN;
  const rank = S.hints===0?"재난 안전 전문가":S.hints<=4?"믿음직한 상황실 요원":"성장하는 신입 연구원";
  $("#stage").innerHTML = `<section class="room granted"><div class="hero">
    <span class="tag">ACCESS GRANTED · 비상구 개방</span>
    <p class="crewline">탈출 근무자: <b>${crewText()}</b></p>
    <h1>상황 종료, <em>탈출 성공</em></h1>
    <p class="story">비상구 너머로 맑게 갠 하늘이 보입니다. 자연재해의 피해는 대비에 따라 줄일 수 있다는 것, 이제 확실히 알겠죠?</p>
    <div class="stats"><div class="stat"><small>걸린 시간 (페널티 포함)</small><b>${Math.floor(t/60)}분 ${String(t%60).padStart(2,"0")}초</b><small>남은 시간 ${fmt(Math.max(0,LIMIT-t))}</small></div>
      <div class="stat"><small>사용한 힌트</small><b>${S.hints}개</b><small>실제 ${Math.floor(real/60)}분 ${String(real%60).padStart(2,"0")}초 + 페널티 ${S.hints*PEN}초</small></div>
      <div class="stat"><small>칭호</small><b style="font-family:var(--display);font-size:20px">${rank}</b></div></div>
    ${recapHtml()}
    <p class="sendstate" id="sendState" aria-live="polite">본부로 기록을 전송하는 중입니다.</p>
    <div class="actions"><button class="btn" id="again">처음부터 다시 하기</button></div>
  </div></section>`;
  sendRecord("탈출 성공");
  $("#again").onclick=restart;
}
function restart(){ const team=S.team; S={team,room:-1,step:0,solved:[],pieces:[],hints:0,start:null,end:null,shown:{}}; drawBoard(); tick(); intro(); window.scrollTo({top:0}); }

    <div class="actions"><button class="btn" id="again">처음부터 다시 하기</button></div>

  sendRecord("시간 초과");
  $("#again").onclick=restart;
  window.scrollTo({top:0});
}

/* 구역4-2: 대책 10개 → 7개 */
const R4M_POOL = [

/* 구역5-1: 빈칸 위치 3가지 중 1개 */
const R5A_BASE = [
  {k:"예방 조치", t:"재난 대응 훈련을 하고, {재해 연보}을/를 발행하며, 재해 예방 사업을 추진한다."},

  {k:"비상 대응", t:"{재난 안전 대책 본부}을/를 구성하고, 현장 지휘소를 설치하여 재난 상황을 안정화한다."},
  {k:"수습·복구 조치", t:"피해 정도를 파악하고 후속 조치를 취한다."}

const R5_BLANKS = [
  {card:2, ans:"재난안전대책본부", hint:"빈칸에 들어갈 명칭은 띄어쓰기 없이 8글자예요. ‘재난○○○○본부’"},

  {card:0, ans:"재해연보", hint:"빈칸에 들어갈 명칭은 띄어쓰기 없이 4글자예요. 예방 조치 단계에서 발행하는 ‘재해 ○○’"}
];
/* 구역5-3: 행동 요령 10개 → 6개, O/X 6개 → 3개 (보기 순서도 섞음) */
const R5B_SCEN = [
  {q:"교실에서 수업 중 건물이 심하게 흔들리기 시작했다.", o:["책상 아래로 들어가 머리를 보호하고, 흔들림이 멈추면 계단을 이용해 운동장 등 안전한 곳으로 대피한다.","엘리베이터를 타고 서둘러 1층으로 내려간다.","창가로 가서 바깥 상황부터 확인한다."]},
  {q:"등산 중 맞은편 산에서 산불이 번지는 것을 발견했다.", o:["119에 신고하고, 젖은 수건으로 입과 코를 막은 채 바람을 등진 방향으로 신속히 대피한다.","불이 번지는 쪽을 향해 빠르게 내려간다.","가까운 계곡 아래 낮은 곳에 몸을 숨긴다."]},
  {q:"며칠간 큰비가 내린 뒤, 마을 뒤 경사면에서 갑자기 물이 솟아 나온다.", o:["즉시 119에 신고하고 높은 곳으로 대피한다.","물길을 따라 계곡 아래쪽으로 내려간다.","집 안 가장 낮은 층에서 비가 그치기를 기다린다."]},
  {q:"황사 경보가 내려진 날, 학교에 가야 한다.", o:["되도록 실내에 머무르며 물을 자주 마시고, 외출할 때는 마스크를 쓰며, 외출 후에는 손과 얼굴을 씻는다.","창문을 활짝 열어 실내 공기를 자주 환기한다.","운동장에서 체육 수업을 평소대로 진행한다."]},
  {q:"폭염 경보가 내려진 한여름 오후, 친구들과 축구를 하기로 했다.", o:["더운 시간대의 야외 활동을 자제하고, 시원하게 지내며 물을 자주 마신다.","땀을 많이 흘리면 몸에 좋으니 한낮에 경기를 한다.","목이 마를 때까지 물을 참았다가 한 번에 많이 마신다."]},
  {q:"밤새 폭설이 내려 길이 꽁꽁 얼었다.", o:["외출할 때 미끄러운 신발은 피하고, 눈 덮인 지붕 등 위험한 곳은 피한다.","평소 신던 바닥이 매끈한 신발을 신고 서둘러 이동한다.","눈이 많이 쌓인 비닐하우스 지붕에 올라가 직접 눈을 치운다."]},
  {q:"가까운 곳에서 화산이 폭발해 화산재가 날리기 시작했다.", o:["마스크나 손수건으로 코와 입을 막고, 오염 물질이 묻은 옷은 깨끗이 세척한다.","밖으로 나가 화산재가 내리는 모습을 가까이에서 촬영한다.","쌓인 화산재를 맨손으로 쓸어 담는다."]}
];   // 보기의 첫 번째가 정답(출제할 때 섞음)
const R5B_OX = [
  {q:"[O/X] 국민 재난 안전 포털은 재난의 예방 및 대비, 안전 보험, 심리 상담 등의 내용을 담고 있다.", a:0},
  {q:"[O/X] 재해 연보는 재난 상황에 대한 학교의 대응 매뉴얼과 학교 안전 관련 활동을 지원한다.", a:1},
  {q:"[O/X] 긴급 재난 문자 송출은 국가 재난 관리 체계의 초기 대응 단계에 해당한다.", a:0},
  {q:"[O/X] 재난 안전 대책 본부는 재난이 모두 끝난 뒤 수습·복구 단계에서 처음 구성된다.", a:1},
  {q:"[O/X] 학교의 황사 대응에서 실내외 방역과 청소는 4단계(후속 조치)에서 실시한다.", a:0},
  {q:"[O/X] 2017년 7월에 출범한 행정 안전부가 국가와 지방 자치 단체의 재난·안전 관리 업무를 총괄한다.", a:0}
];
let R1,R2A,R2B,R3,R4,R4M,R5A,R5B,R5BLANK;
function buildQuestions(){
  if(!S.q){
    const by=v=>R1_POOL.map((r,i)=>r.a===v?i:-1).filter(i=>i>=0);
    const pick1=a=>shuffle(a).slice(0,5);
    const groups=["폭염 주의보","폭염 경보","호우 주의보","특보 없음"].map(a=>R2B_POOL.map((r,i)=>r.a===a?i:-1).filter(i=>i>=0));
    const first=groups.map(g=>shuffle(g)[0]); const rest=shuffle(R2B_POOL.map((_,i)=>i).filter(i=>!first.includes(i))).slice(0,2);
    S.q = {
      r1: [...pick1(by("현상")), ...pick1(by("재해"))],
      r2a: R2A_POOL.map(()=>Math.floor(Math.random()*2)),
      r2b: shuffle([...first,...rest]),
      r3: R3_POOL.map(v=>Math.floor(Math.random()*v.length)),
      r4d: pickN(R4_DECOYS,3),
      r4m: pickN(R4M_POOL,7),
      r5b: Math.floor(Math.random()*R5_BLANKS.length),
      r5s: pickN(R5B_SCEN,5).map(i=>({i, perm:shuffle([0,1,2])})),
      r5x: pickN(R5B_OX,3)
    };
  }
  const q=S.q;
  R1  = q.r1.map(i=>R1_POOL[i]);
  R2A = R2A_POOL.map((p,i)=>({n:p.n, t:p.t[q.r2a[i]]}));
  R2B = q.r2b.map(i=>R2B_POOL[i]);
  R3  = R3_POOL.map((v,i)=>v[q.r3[i]]);
  R4  = [...R4_CAUSES, ...q.r4d.map(i=>R4_DECOYS[i])];
  R4M = q.r4m.map(i=>R4M_POOL[i]);
  R5BLANK = R5_BLANKS[q.r5b];
  R5A = R5A_BASE.map((c,i)=>({k:c.k, t:c.t.replace(/\{([^}]*)\}/,(_,w)=> i===R5BLANK.card ? "<span class='blank' aria-label='빈칸'></span>" : w)}));
  R5B = [...q.r5s.map(({i,perm})=>({q:R5B_SCEN[i].q, o:perm.map(j=>R5B_SCEN[i].o[j]), a:perm.indexOf(0)})),
         ...q.r5x.map(i=>({q:R5B_OX[i].q, o:["O","X"], a:R5B_OX[i].a, ox:true}))];
}

function render(){ [room1,room2,room3,room4,room5,finalDoor][S.room](); }

/* 선생님용 전송 테스트: 주소 끝에 #sendtest 를 붙여 열면 게임 대신 테스트 화면이 나온다 */
function sendTest(){
  $("#stage").innerHTML = `<section class="room"><div class="hero">
    <span class="tag">TEACHER · 기록 전송 테스트</span>
    <h1>기록 전송 <em>테스트</em></h1>
    <p class="story">게임을 끝까지 하지 않고 구글 시트로 테스트 기록을 한 줄 보냅니다.</p>
    <div class="data"><b>현재 설정된 전송 주소</b>${SHEET_URL ? esc(SHEET_URL) : "(비어 있음) index.html의 SHEET_URL에 웹 앱 주소를 넣어 주세요."}</div>
    <div class="actions"><button class="btn" id="tbtn" ${SHEET_URL?"":"disabled"}>테스트 기록 보내기</button></div>
    <p class="sendstate" id="tstate" aria-live="polite"></p>
  </div></section>`;
  const b=$("#tbtn"); if(!b) return;
  b.onclick=()=>{
    const st=$("#tstate"); st.textContent="보내는 중…";
    const rec={result:"게임 전송 테스트",team:"선생님 테스트",real:"-",penalty:0,total:"-",remain:"-",hints:0,fails:0,zones:0,pieces:0};
    if(!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(SHEET_URL)) st.textContent="주의: 주소가 https://script.google.com/macros/s/…/exec 형태가 아닙니다. 웹 앱 주소를 다시 복사해 주세요. (그래도 보내 봅니다)";
    fetch(SHEET_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(rec)})
      .then(()=>{ st.textContent = st.textContent.replace("보내는 중…","").trim() + " 요청을 보냈습니다. 10초쯤 뒤 시트에 ‘게임 전송 테스트’ 줄이 생겼는지 확인하세요."; })
      .catch(err=>{ st.textContent = "보내지 못했습니다: 이 페이지에서 외부 주소로의 연결이 막혀 있습니다. (claude.ai 링크에서는 전송이 되지 않습니다. 깃허브 주소에서 열어 주세요.)"; });
  };
}
function boot(data){
  if(data && data.S){ S=data.S; }
  if(S.room>=0 || S.end || S.over) buildQuestions();
  drawBoard(); tick();
  if(location.hash==="#sendtest"){ sendTest(); return; }
  if(S.end) ending(); else if(S.over) timeOver(); else if(S.room<0) intro(); else render();
}
window.claude?.hot?.snapshot?.(()=>({S}));
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
</script>
